# Round 6 - Hub Server Configuration

# Database MySQL
database:
  host: "mysql52-farm1.kinghost.net"
  port: 3306
  database: "zrfa"
  username: "zrfa"
  password: "Rafael141011"
  pool:
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000

# Spawn do hub
spawn:
  world: "world"
  x: 0.5
  y: 100.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# Scoreboard
scoreboard:
  enabled: true
  title: "&#FF1744ʀᴏᴜɴᴅ 6"
  update-interval: 20
  lines:
    - ""
    - "&#FFFFFFᴊᴏɢᴀᴅᴏʀ: &#FF1744{player}"
    - "&#FFFFFFᴏɴʟɪɴᴇ: &#FF1744{online}"
    - ""
    - "&#FFFFFFᴄᴏɪɴꜱ: &#FF1744{coins}"
    - "&#FFFFFFᴋɪʟʟꜱ: &#FF1744{kills}"
    - ""
    - "&#FFFFFF{server}"

# NPCs
npcs:
  enabled: true
  # NPCs serão carregados do banco de dados

# Hologramas
holograms:
  enabled: true
  # Hologramas serão carregados do banco de dados

# Tags
tags:
  enabled: true
  use-placeholderapi: true
  default-tag: "&#FFFFFFᴊᴏɢᴀᴅᴏʀ"

# Mensagens
messages:
  prefix: "&#FF1744[Hub] "
  
  welcome: "&#FFFFFFʙᴇᴍ-ᴠɪɴᴅᴏ ᴀᴏ &#FF1744Round 6&#FFFFFF!"
  
  teleported-spawn: "&#FFFFFFᴠᴏᴄᴇ̂ ꜰᴏɪ ᴛᴇʟᴇᴘᴏʀᴛᴀᴅᴏ ᴘᴀʀᴀ ᴏ ꜱᴘᴀᴡɴ!"
  
  npc-created: "&#FFFFFFNPC &#FF1744{name} &#FFFFFFᴄʀɪᴀᴅᴏ ᴄᴏᴍ ꜱᴜᴄᴇꜱꜱᴏ!"
  npc-deleted: "&#FFFFFFNPC &#FF1744{name} &#FFFFFFʀᴇᴍᴏᴠɪᴅᴏ ᴄᴏᴍ ꜱᴜᴄᴇꜱꜱᴏ!"
  
  hologram-created: "&#FFFFFFʜᴏʟᴏɢʀᴀᴍᴀ ᴄʀɪᴀᴅᴏ ᴄᴏᴍ ꜱᴜᴄᴇꜱꜱᴏ!"
  hologram-deleted: "&#FFFFFFʜᴏʟᴏɢʀᴀᴍᴀ ʀᴇᴍᴏᴠɪᴅᴏ ᴄᴏᴍ ꜱᴜᴄᴇꜱꜱᴏ!"

# Proteções
protection:
  # Bloquear dano
  block-damage: true
  
  # Bloquear fome
  block-hunger: true
  
  # Bloquear quebrar blocos
  block-break: true
  
  # Bloquear colocar blocos
  block-place: true
  
  # Bloquear drop de itens
  block-drop: true
  
  # Bloquear pickup de itens
  block-pickup: true
  
  # Bloquear PvP
  block-pvp: true
  
  # Bloquear interação com entidades
  block-entity-interact: true

# Plugin Hider
plugin-hider:
  enabled: true
  show-own-plugins: true
  fake-plugins:
    - "Essentials"
    - "WorldEdit"
    - "Vault"
