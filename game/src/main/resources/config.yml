# Configurações do Round 6
round6:
  # Tempo de espera antes de iniciar (segundos)
  waiting-time: 30
  
  # Mínimo de jogadores para iniciar
  min-players: 2
  
  # Máximo de jogadores
  max-players: 100
  
  # Tempo entre jogos (segundos)
  game-cooldown: 60
  
  # Prêmio por vitória
  win-reward: 1000
  
  # Localização do lobby (onde jogadores aparecem ao entrar)
  lobby-location:
    world: "world"
    x: 0
    y: 100
    z: 0
    yaw: 0
    pitch: 0
  
  # Localização da arena (onde o jogo acontece)
  arena-location:
    world: "world"
    x: 100
    y: 100
    z: 100
    yaw: 0
    pitch: 0

